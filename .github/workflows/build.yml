name: Proton v6.1.0 + close_range (KSU)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make bison libssl-dev curl lz4 brotli flex bc cpio kmod ccache zip \
            binutils-aarch64-linux-gnu device-tree-compiler python3 git

      - name: Fetch Proton v6.1.0 and the close_range commits
        run: |
          git clone --filter=blob:none --shallow-since=2026-01-01 --no-single-branch \
            https://github.com/ProtonKernel/Proton.git kernel
          cd kernel
          git checkout -B closerange v6.1.0
          git config user.email "ci@local"
          git config user.name "ci"

      - name: Backport close_range() + CLOSE_RANGE_CLOEXEC
        working-directory: kernel
        run: |
          set -euo pipefail
          pick() { git cherry-pick -x "$1"; }
          pick ddfdedef1447   # UPSTREAM: open: add close_range()
          pick 82b901a91c74   # UPSTREAM: close_range: add CLOSE_RANGE_UNSHARE
          # BACKPORT: arch: wire-up close_range() conflicts with process_madvise (absent in v6.1.0);
          # apply the arm64 parts by hand.
          sed -i '/^__SYSCALL(__NR_clone3, sys_clone3)$/{n;s/^#endif$/#endif\n#define __NR_close_range 436\n__SYSCALL(__NR_close_range, sys_close_range)/}' include/uapi/asm-generic/unistd.h
          sed -i 's/^#define __NR_syscalls 436$/#define __NR_syscalls 437/' include/uapi/asm-generic/unistd.h
          sed -i 's/^__SYSCALL(__NR_clone3, sys_clone3)$/&\n#define __NR_close_range 436\n__SYSCALL(__NR_close_range, sys_close_range)/' arch/arm64/include/asm/unistd32.h
          sed -i 's/^#define __NR_compat_syscalls\t\t436$/#define __NR_compat_syscalls\t\t437/' arch/arm64/include/asm/unistd.h
          git add include/uapi/asm-generic/unistd.h arch/arm64/include/asm/unistd32.h arch/arm64/include/asm/unistd.h
          git commit -q -m "BACKPORT: arch: wire-up close_range() (arm64 only)" \
            -m "(cherry picked from commit 5714efb5b1c5, conflicts resolved for v6.1.0)"
          for c in f5c86606c51e cebb8f6e99d6 65453d09bc8d 6365313ba30a 0466cde0e8fa e628a10eab8a 14d8a61072a4; do
            pick "$c"
          done
          grep -n 'close_range' include/uapi/asm-generic/unistd.h arch/arm64/include/asm/unistd32.h
          grep -n '__NR_syscalls 437' include/uapi/asm-generic/unistd.h
          grep -n '__NR_compat_syscalls.*437' arch/arm64/include/asm/unistd.h
          grep -n 'CLOSE_RANGE_CLOEXEC' include/uapi/linux/close_range.h
          git log --oneline v6.1.0..HEAD

      - name: Build (KernelSU, same as official KSU release)
        working-directory: kernel
        run: |
          mkdir -p ../ws
          export WP="$(realpath ../ws)"
          bash build/ckbuild.sh -ckR
          ls -l build/*.zip

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ProtonPlus-v6.1.0-closerange-KSU
          path: kernel/build/*.zip
          if-no-files-found: error
